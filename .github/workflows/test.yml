name: test

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

env:
  GOWORK: off

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify core packages do not import llm-agent
        run: |
          hits=$(rg -n 'github.com/costa92/llm-agent([/"[:space:]]|$)' . \
            --glob '!adapter/**' \
            --glob '!.github/**' \
            --glob '!README.md' \
            --glob '!CHANGELOG.md' \
            --glob '!go.mod' || true)
          if [ -n "$hits" ]; then
            echo "::error::core module boundary violated; only adapter/ may import github.com/costa92/llm-agent"
            echo "$hits"
            exit 1
          fi
          echo "OK: core packages stay independent from github.com/costa92/llm-agent"
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build ./...
      - name: go test
        run: go test ./...
