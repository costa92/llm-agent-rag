name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

env:
  GOWORK: off

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify core packages do not import llm-agent
        run: |
          hits=$(rg -n 'github.com/costa92/llm-agent([/"[:space:]]|$)' . \
            --glob '!adapter/**' \
            --glob '!.github/**' \
            --glob '!README.md' \
            --glob '!CHANGELOG.md' \
            --glob '!go.mod' || true)
          if [ -n "$hits" ]; then
            echo "::error::core module boundary violated; only adapter/ may import github.com/costa92/llm-agent"
            echo "$hits"
            exit 1
          fi
          echo "OK: core packages stay independent from github.com/costa92/llm-agent"
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build ./...
      - name: go test
        run: go test ./...
      - name: API snapshot gate
        # Visibility-only: the snapshot gate also runs inside `go test ./...`
        # above. This explicitly-named step surfaces it in the CI log.
        run: go test ./internal/apisnapshot/...
      - name: Build-tagged adapter (llmagent)
        # The ONLY place CI touches the core github.com/costa92/llm-agent
        # dependency. adapter/llmagent is built under //go:build llmagent and
        # imports the core module; setup-go above resolves it from go.sum.
        # This closes the adapter/llmagent CI coverage gap.
        run: |
          go build -tags llmagent ./...
          go test -tags llmagent ./adapter/...
